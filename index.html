<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bateria Social</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Estilos do projeto -->
<link href="style/style.css" rel="stylesheet">

</head>

<canvas id="canvas-particulas"></canvas>
<body class="d-flex justify-content-center align-items-center min-vh-100">

<div class="broche rounded-4 p-4" id="broche" tabindex="0">
    <div class="titulo text-center fs-5 mb-3 text-warning">MINHA BATERIA SOCIAL</div>

    <div class="barra" id="barra">
        <div class="segmento red">😞</div>
        <div class="segmento red">🙁</div>
        <div class="segmento pink">😕</div>
        <div class="segmento yellow">😐</div>
        <div class="segmento green">🙂</div>
        <div class="segmento blue">😊</div>
        <div class="segmento blue">😁</div>
    </div>

    <div class="slider rounded-pill" id="slider">
        <div class="raio" id="raio" tabindex="0">⚡</div>
        <div class="balao text-white p-2 rounded" id="balao"></div>
    </div>

    <div class="bateria-container">
        <div class="bateria-wrapper">
            <div class="bateria">
                <div class="bateria-nivel" id="bateria-nivel"></div>
            </div>
            <div class="bateria-pino"></div>
        </div>
        <span class="bateria-porcentagem" id="bateria-porcentagem">50%</span>
    </div>

    <div class="mensagem text-secondary mt-3" id="mensagem"></div>

    <div class="legenda row g-2 pt-3 border-top mt-2">
        <div class="legenda-item col-6"><span>😞</span> Muito esgotado</div>
        <div class="legenda-item col-6"><span>🙁</span> Esgotado</div>
        <div class="legenda-item col-6"><span>😕</span> Baixo</div>
        <div class="legenda-item col-6"><span>😐</span> Neutro</div>
        <div class="legenda-item col-6"><span>🙂</span> Bem</div>
        <div class="legenda-item col-6"><span>😊</span> Animado</div>
        <div class="legenda-item col-6"><span>😁</span> No topo</div>
    </div>

    <button class="btn-registrar mt-4" id="btn-registrar">⚡ Registrar agora</button>

    <div class="historico" id="historico">
        <div class="historico-titulo">Histórico de hoje</div>
        <div class="historico-lista" id="historico-lista">
            <div class="historico-vazio" id="historico-vazio">Nenhum registro ainda.</div>
        </div>
    </div>
</div>

<!-- Modal de visualização -->
<div class="modal-glass" id="modal-visualizacao">
    <div class="modal-glass-box" style="text-align:center;">
        <h6>Detalhes do registro</h6>
        <div id="viz-emoji" style="font-size:3rem; margin-bottom:10px;"></div>
        <div id="viz-estado" style="font-size:1.2rem; font-weight:600; color:#fff; margin-bottom:8px;"></div>
        <div id="viz-hora" style="font-size:0.85rem; color:rgba(255,255,255,0.4); margin-bottom:24px;">
            <i class="bi bi-clock me-1"></i><span></span>
        </div>
        <button class="btn-modal" id="viz-fechar"><i class="bi bi-x-lg me-1"></i>Fechar</button>
    </div>
</div>

<!-- Modal de confirmação de exclusão -->
<div class="modal-glass" id="modal-confirmacao">
    <div class="modal-glass-box" style="text-align:center;">
        <div style="font-size:2rem; margin-bottom:12px;">🗑️</div>
        <h6 style="font-size:0.75rem; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,0.4); margin-bottom:8px;">Excluir registro</h6>
        <p style="color:rgba(255,255,255,0.8); font-size:1rem; margin-bottom:22px;">Deseja realmente excluir este registro?</p>
        <div class="modal-acoes">
            <button class="btn-modal" id="confirmar-nao"><i class="bi bi-x-lg me-1"></i>Não</button>
            <button class="btn-modal confirmar-sim" id="confirmar-sim"><i class="bi bi-check-lg me-1"></i>Sim</button>
        </div>
    </div>
</div>

<!-- Modal de edição -->
<div class="modal-glass" id="modal-edicao">
    <div class="modal-glass-box">
        <h6>Editar registro</h6>
        <select id="modal-select">
            <option value="0">Muito esgotado 😞</option>
            <option value="1">Esgotado 🙁</option>
            <option value="2">Baixo 😕</option>
            <option value="3">Neutro 😐</option>
            <option value="4">Bem 🙂</option>
            <option value="5">Animado 😊</option>
            <option value="6">No topo 😁</option>
        </select>
        <div class="modal-acoes">
            <button class="btn-modal" id="modal-cancelar">Cancelar</button>
            <button class="btn-modal salvar" id="modal-salvar"><i class="bi bi-check-lg me-1"></i>Salvar</button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script>
const raio    = document.getElementById("raio");
const slider  = document.getElementById("slider");
const balao   = document.getElementById("balao");
const broche  = document.getElementById("broche");
const barra   = document.getElementById("barra");
const mensagemEl         = document.getElementById("mensagem");
const bateriaNivel       = document.getElementById("bateria-nivel");
const bateriaPorcentagem = document.getElementById("bateria-porcentagem");
const legendaItens       = document.querySelectorAll(".legenda-item");
const btnRegistrar       = document.getElementById("btn-registrar");
const historicoLista     = document.getElementById("historico-lista");
const historicoVazio     = document.getElementById("historico-vazio");

const estados = [
    "Muito esgotado 😞",
    "Esgotado 🙁",
    "Baixo 😕",
    "Neutro 😐",
    "Bem 🙂",
    "Animado 😊",
    "No topo 😁"
];

const mensagens = [
    "Descanse. Você merece um tempo só seu. 💤",
    "Tudo bem precisar de uma pausa. 🌿",
    "Vá devagar. Recupere suas energias. 🍵",
    "Equilíbrio é a chave. Siga em frente! ⚖️",
    "Você está indo bem! Continue assim. 🌟",
    "Energia alta! Aproveite esse momento. 🎉",
    "Você está arrasando! No topo! 🚀"
];

/* Porcentagens e cores da bateria por índice */
const bateriaPercents = [5, 18, 33, 50, 66, 82, 100];
const bateriaCores    = ["#ff4d4d", "#ff7aa2", "#ffd966", "#ffd966", "#6fdc6f", "#6fd0ff", "#6fd0ff"];

/* Cores de fundo do card por índice (do mais esgotado ao mais energizado) */
const cores = [
    "#3b1a1a",
    "#3b2230",
    "#3b3520",
    "#1e3020",
    "#1a2b3b",
    "#1a253b",
    "#1a1a3b"
];

let dragging = false;
let indiceAtual = 0;

/* FUNÇÃO PARA ATUALIZAR */
function atualizar(posX, mostrarBalao = true) {
    const rect = slider.getBoundingClientRect();
    let x = posX - rect.left;

    if (x < 0) x = 0;
    if (x > rect.width) x = rect.width;

    raio.style.left = x + "px";

    const index = Math.min(
        Math.floor((x / rect.width) * estados.length),
        estados.length - 1
    );

    if (index !== indiceAtual) {
        indiceAtual = index;

        // mensagem motivacional
        mensagemEl.textContent = mensagens[index];

        // bateria
        bateriaNivel.style.width = bateriaPercents[index] + "%";
        bateriaNivel.style.backgroundColor = bateriaCores[index];
        bateriaPorcentagem.textContent = bateriaPercents[index] + "%";
        bateriaPorcentagem.style.color = bateriaCores[index];

        // destaque na legenda
        legendaItens.forEach((el, i) => el.classList.toggle("ativo", i === index));
    }

    balao.textContent = estados[index];
    balao.style.left = x + "px";
    if (mostrarBalao) balao.classList.add("show");
}

/* MOUSE */
raio.addEventListener("mousedown", () => dragging = true);

document.addEventListener("mouseup", () => {
    dragging = false;
    balao.classList.remove("show");
});

document.addEventListener("mousemove", (e) => {
    if (dragging) atualizar(e.clientX);
});

/* CLIQUE DIRETO NA BARRA */
barra.addEventListener("click", (e) => {
    const barraRect = barra.getBoundingClientRect();
    const sliderRect = slider.getBoundingClientRect();
    const proporcao = (e.clientX - barraRect.left) / barraRect.width;
    const x = sliderRect.left + proporcao * sliderRect.width;
    atualizar(x, false);
    mensagemEl.textContent = mensagens[indiceAtual];
});

/* TECLADO (setas ← →) */
raio.addEventListener("keydown", (e) => {
    const rect = slider.getBoundingClientRect();
    const passo = rect.width / (estados.length - 1);
    const atualX = parseFloat(raio.style.left) || 0;

    if (e.key === "ArrowRight") {
        atualizar(slider.getBoundingClientRect().left + Math.min(atualX + passo, rect.width), false);
        e.preventDefault();
    } else if (e.key === "ArrowLeft") {
        atualizar(slider.getBoundingClientRect().left + Math.max(atualX - passo, 0), false);
        e.preventDefault();
    }
});

/* TOUCH (CELULAR) */
raio.addEventListener("touchstart", () => dragging = true, { passive: true });

document.addEventListener("touchend", () => {
    dragging = false;
    balao.classList.remove("show");
});

document.addEventListener("touchmove", (e) => {
    if (dragging) atualizar(e.touches[0].clientX);
}, { passive: true });

/* HISTÓRICO */
const CHAVE_HISTORICO = "bateria_social_historico";

function hojeStr() {
    return new Date().toLocaleDateString("pt-BR");
}

function carregarHistorico() {
    const salvo = JSON.parse(localStorage.getItem(CHAVE_HISTORICO) || "{}");
    // limpa registros de outros dias
    if (salvo.data !== hojeStr()) return [];
    return salvo.registros || [];
}

function salvarHistorico(registros) {
    localStorage.setItem(CHAVE_HISTORICO, JSON.stringify({ data: hojeStr(), registros }));
}

function renderizarHistorico() {
    const registros = carregarHistorico();
    historicoLista.querySelectorAll(".historico-item").forEach(el => el.remove());

    if (registros.length === 0) {
        historicoVazio.style.display = "block";
        return;
    }

    historicoVazio.style.display = "none";

    // mais recente primeiro, mantendo índice original para CRUD
    [...registros].map((reg, i) => ({ ...reg, i })).reverse().forEach(({ estado, hora, i }) => {
        const item = document.createElement("div");
        item.className = "historico-item";
        item.innerHTML = `
            <div class="info">
                <span>${estado}</span>
                <span class="hora"><i class="bi bi-clock me-1"></i>${hora}</span>
            </div>
            <div class="acoes">
                <button class="btn-crud visualizar" title="Visualizar" data-i="${i}"><i class="bi bi-eye"></i></button>
                <button class="btn-crud editar"     title="Editar"     data-i="${i}"><i class="bi bi-pencil"></i></button>
                <button class="btn-crud excluir"    title="Excluir"    data-i="${i}"><i class="bi bi-trash3"></i></button>
            </div>`;
        historicoLista.appendChild(item);
    });

    // eventos dos botões
    historicoLista.querySelectorAll(".btn-crud.visualizar").forEach(btn => {
        btn.addEventListener("click", () => abrirVisualizacao(parseInt(btn.dataset.i)));
    });
    historicoLista.querySelectorAll(".btn-crud.editar").forEach(btn => {
        btn.addEventListener("click", () => abrirEdicao(parseInt(btn.dataset.i)));
    });
    historicoLista.querySelectorAll(".btn-crud.excluir").forEach(btn => {
        btn.addEventListener("click", () => excluirRegistro(parseInt(btn.dataset.i)));
    });
}

/* REGISTRAR */
btnRegistrar.addEventListener("click", () => {
    const agora = new Date();
    const hora = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    const registros = carregarHistorico();
    registros.push({ estado: estados[indiceAtual], hora });
    salvarHistorico(registros);
    renderizarHistorico();

    btnRegistrar.innerHTML = "<i class='bi bi-check-lg me-1'></i>Registrado!";
    btnRegistrar.classList.add("confirmado");
    setTimeout(() => {
        btnRegistrar.innerHTML = "⚡ Registrar agora";
        btnRegistrar.classList.remove("confirmado");
    }, 1800);
});

/* VISUALIZAR */
const modalVisualizacao = document.getElementById("modal-visualizacao");
const vizFechar         = document.getElementById("viz-fechar");
const vizEmoji          = document.getElementById("viz-emoji");
const vizEstado         = document.getElementById("viz-estado");
const vizHora           = document.getElementById("viz-hora").querySelector("span");

// extrai emoji e texto do estado (ex: "Bem 🙂" → emoji "🙂", texto "Bem")
const emojisPorIndice = ["😞","🙁","😕","😐","🙂","😊","😁"];

function abrirVisualizacao(i) {
    const registros = carregarHistorico();
    const reg = registros[i];
    const idxEstado = estados.indexOf(reg.estado);
    vizEmoji.textContent  = emojisPorIndice[idxEstado] ?? "⚡";
    vizEstado.textContent = reg.estado;
    vizHora.textContent   = reg.hora;
    modalVisualizacao.classList.add("aberto");
}

vizFechar.addEventListener("click", () => modalVisualizacao.classList.remove("aberto"));

modalVisualizacao.addEventListener("click", (e) => {
    if (e.target === modalVisualizacao) modalVisualizacao.classList.remove("aberto");
});

/* EXCLUIR — com confirmação */
const modalConfirmacao = document.getElementById("modal-confirmacao");
const confirmarSim     = document.getElementById("confirmar-sim");
const confirmarNao     = document.getElementById("confirmar-nao");
let indiceParaExcluir  = null;

function excluirRegistro(i) {
    indiceParaExcluir = i;
    modalConfirmacao.classList.add("aberto");
}

confirmarSim.addEventListener("click", () => {
    if (indiceParaExcluir === null) return;
    const registros = carregarHistorico();
    registros.splice(indiceParaExcluir, 1);
    salvarHistorico(registros);
    renderizarHistorico();
    modalConfirmacao.classList.remove("aberto");
    indiceParaExcluir = null;
});

confirmarNao.addEventListener("click", () => {
    modalConfirmacao.classList.remove("aberto");
    indiceParaExcluir = null;
});

modalConfirmacao.addEventListener("click", (e) => {
    if (e.target === modalConfirmacao) {
        modalConfirmacao.classList.remove("aberto");
        indiceParaExcluir = null;
    }
});

/* EDITAR — modal */
const modalEdicao   = document.getElementById("modal-edicao");
const modalSelect   = document.getElementById("modal-select");
const modalCancelar = document.getElementById("modal-cancelar");
const modalSalvar   = document.getElementById("modal-salvar");
let indiceSendoEditado = null;

function abrirEdicao(i) {
    const registros = carregarHistorico();
    indiceSendoEditado = i;
    // pré-seleciona o estado atual no select
    const indexEstado = estados.indexOf(registros[i].estado);
    modalSelect.value = indexEstado >= 0 ? indexEstado : 0;
    modalEdicao.classList.add("aberto");
}

modalCancelar.addEventListener("click", () => {
    modalEdicao.classList.remove("aberto");
    indiceSendoEditado = null;
});

modalEdicao.addEventListener("click", (e) => {
    if (e.target === modalEdicao) {
        modalEdicao.classList.remove("aberto");
        indiceSendoEditado = null;
    }
});

modalSalvar.addEventListener("click", () => {
    if (indiceSendoEditado === null) return;
    const registros = carregarHistorico();
    registros[indiceSendoEditado].estado = estados[parseInt(modalSelect.value)];
    salvarHistorico(registros);
    renderizarHistorico();
    modalEdicao.classList.remove("aberto");
    indiceSendoEditado = null;
});

/* EMOJIS FLUTUANTES */
(function () {
    const canvas = document.getElementById("canvas-particulas");
    const ctx    = canvas.getContext("2d");

    const EMOJIS = ["😞","🙁","😕","😐","🙂","😊","😁","⚡"];
    let particulas = [];
    const mouse = { x: -9999, y: -9999 };
    const RAIO_REPULSAO = 120;
    const FORCA_REPULSAO = 3.5;
    const AMORTECIMENTO  = 0.92;

    function redimensionar() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function criarParticula(forcarY) {
        const tamanho = Math.random() * 22 + 18;
        return {
            emoji:    EMOJIS[Math.floor(Math.random() * EMOJIS.length)],
            x:        Math.random() * canvas.width,
            y:        forcarY !== undefined ? forcarY : Math.random() * canvas.height,
            vx:       (Math.random() - 0.5) * 0.35,
            vy:       -(Math.random() * 0.4 + 0.15),
            vxBase:   (Math.random() - 0.5) * 0.35,
            vyBase:   -(Math.random() * 0.4 + 0.15),
            tamanho,
            alfa:     Math.random() * 0.12 + 0.06,
            dalfa:    (Math.random() * 0.002 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
            alfaMin:  0.04,
            alfaMax:  0.18,
            rotacao:  (Math.random() - 0.5) * 0.3,
            drotacao: (Math.random() - 0.5) * 0.003,
        };
    }

    function iniciar() {
        redimensionar();
        particulas = Array.from({ length: 22 }, () => criarParticula());
    }

    function desenhar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particulas.length; i++) {
            const p = particulas[i];

            // repulsão pelo mouse
            const dx   = p.x - mouse.x;
            const dy   = p.y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < RAIO_REPULSAO && dist > 0) {
                const forca = (RAIO_REPULSAO - dist) / RAIO_REPULSAO * FORCA_REPULSAO;
                p.vx += (dx / dist) * forca;
                p.vy += (dy / dist) * forca;
                p.alfa = Math.min(p.alfaMax * 2.2, p.alfa + 0.04); // ilumina ao ser empurrado
            } else {
                // retorna suavemente à velocidade base
                p.vx = p.vx * AMORTECIMENTO + p.vxBase * (1 - AMORTECIMENTO);
                p.vy = p.vy * AMORTECIMENTO + p.vyBase * (1 - AMORTECIMENTO);
                p.alfa += p.dalfa;
            }

            // limita velocidade máxima
            const vel = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            if (vel > 6) { p.vx = (p.vx / vel) * 6; p.vy = (p.vy / vel) * 6; }

            if (p.alfa <= p.alfaMin || p.alfa >= p.alfaMax) p.dalfa *= -1;
            p.alfa = Math.max(p.alfaMin, Math.min(p.alfaMax * 2.5, p.alfa));

            p.x       += p.vx;
            p.y       += p.vy;
            p.rotacao += p.drotacao + (p.vx * 0.01); // rotação reage à velocidade

            if (p.y < -p.tamanho * 2) {
                particulas[i] = criarParticula(canvas.height + p.tamanho);
                continue;
            }
            if (p.x < -60) p.x = canvas.width  + 60;
            if (p.x > canvas.width + 60) p.x = -60;

            ctx.save();
            ctx.globalAlpha = p.alfa;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotacao);
            ctx.font = `${p.tamanho}px serif`;
            ctx.textAlign    = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(p.emoji, 0, 0);
            ctx.restore();
        }

        requestAnimationFrame(desenhar);
    }

    window.addEventListener("resize", redimensionar);
    window.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener("mouseleave", ()  => { mouse.x = -9999;    mouse.y = -9999; });

    iniciar();
    desenhar();
})();

/* INICIALIZAR no centro (Neutro) */
window.addEventListener("load", () => {
    const rect = slider.getBoundingClientRect();
    const centroX = rect.left + rect.width / 2;
    atualizar(centroX, false);
    renderizarHistorico();
});
</script>

</body>
</html>
